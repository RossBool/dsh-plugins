# dsh-team-mode：团队模式开关 + 团队协作路由。
#
# 进程级只有一份 teamMode 注册表（host 单例），
# 提供 isActive(sessionId?) / setGlobal / setSession / subscribe 的查询/订阅接口；
# 其他插件（如 dsh-agent-orchestration 的协作画布与协作路由）
# 通过 ctx.get('teamMode') 查询后再决定是否激活自身。
#
# 三行 Cordis 装配：
#   team-mode-host   — 注册 teamMode 服务 + JSON 通道
#   team-mode-route  — 协作路由，仅在团队模式开启时触发多 agent 派发
#   team-mode-toggle — 客户端 UI（团队模式开关按钮）
#
# 客户端注入：team-mode-toggle UI（团队模式开关按钮）
- insert:
    - id: team-mode-host
      name: dsh-team-mode
    - id: team-mode-route
      name: dsh-team-mode/route
    - id: team-mode-toggle
      name: dsh-team-mode/toggle